<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Révision — Banque de vérifications Permis B</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:#eef2f9;color:#0f172a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding-bottom:60px;
  }
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);
    backdrop-filter:blur(10px);border-bottom:1px solid #e2e8f0;
    padding:12px 14px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:17px;margin:0 0 8px}
  h1 span{color:#64748b;font-weight:500;font-size:13px}
  .stats{float:right;font-size:12px;color:#64748b;font-weight:700}
  .search{
    width:100%;border:1px solid #e2e8f0;border-radius:11px;
    padding:10px 12px;font-size:14px;font-family:inherit;outline:none;
  }
  .search:focus{border-color:#94a3b8}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .chip{
    border:1px solid #e2e8f0;background:#fff;border-radius:999px;
    padding:7px 12px;font-size:12.5px;font-weight:700;color:#64748b;
    cursor:pointer;font-family:inherit;
  }
  .chip.active{background:#0f172a;color:#fff;border-color:#0f172a}
  .chip[data-f="VI"].active{background:#2563eb;border-color:#2563eb}
  .chip[data-f="VE"].active{background:#0d9488;border-color:#0d9488}
  .chip[data-f="QSER"].active{background:#d97706;border-color:#d97706}
  .chip[data-f="SEC"].active{background:#dc2626;border-color:#dc2626}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .btn{
    border:1px solid #e2e8f0;background:#fff;border-radius:10px;
    padding:8px 12px;font-size:12.5px;font-weight:700;color:#334155;
    cursor:pointer;font-family:inherit;
  }
  .grid{
    max-width:1100px;margin:14px auto;padding:0 14px;
    display:grid;gap:11px;grid-template-columns:1fr;
  }
  @media(min-width:860px){.grid{grid-template-columns:1fr 1fr}}

  /* ---- Carte = <details> natif ---- */
  details.card{
    background:#fff;border:1px solid #e2e8f0;border-radius:16px;
    box-shadow:0 1px 2px rgba(15,23,42,.05);overflow:hidden;
  }
  details.card[open]{border-color:#c7d2fe;background:#fdfdff}
  details.card > summary{
    list-style:none;cursor:pointer;padding:13px 40px 13px 15px;
    position:relative;display:block;
  }
  details.card > summary::-webkit-details-marker{display:none}
  details.card > summary::marker{content:""}
  details.card > summary::after{
    content:"▾";position:absolute;right:14px;top:14px;
    color:#94a3b8;font-size:13px;transition:transform .2s;
  }
  details.card[open] > summary::after{transform:rotate(180deg)}
  .head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .badge{
    font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 8px;border-radius:6px;
  }
  .badge.VI{background:#dbeafe;color:#1d4ed8}
  .badge.VE{background:#ccfbf1;color:#0f766e}
  .badge.QSER{background:#fef3c7;color:#b45309}
  .badge.SEC{background:#fee2e2;color:#b91c1c}
  .num{margin-left:auto;font-size:11px;font-weight:700;color:#94a3b8}
  .q{margin:0;font-size:14.8px;line-height:1.45;font-weight:650;color:#111827}
  .answer{
    padding:0 15px 14px;margin-top:2px;border-top:1px dashed #e2e8f0;
    padding-top:10px;
  }
  .alabel{
    display:block;font-size:10px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;color:#0f766e;margin-bottom:3px;
  }
  .answer p{margin:3px 0 0;font-size:14.3px;line-height:1.55;color:#1e293b}
  .answer ul{margin:3px 0 0;padding-left:18px}
  .answer li{margin:4px 0;font-size:14.3px;line-height:1.5;color:#1e293b}
  .empty{grid-column:1/-1;text-align:center;color:#64748b;padding:40px 20px;font-weight:600}
  footer{max-width:1100px;margin:24px auto 0;padding:0 16px;
    font-size:11.5px;color:#94a3b8;text-align:center;line-height:1.6}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <h1>Banque de vérifications <span>· Permis B (SOULAIKA L'homme fort)</span>
      <span class="stats" id="stats"></span>
    </h1>
    <input id="search" class="search" type="search" placeholder="Rechercher une question, un mot-clé…">
    <div class="chips" id="chips">
      <button class="chip active" data-f="ALL">Toutes</button>
      <button class="chip" data-f="VI">VI · Intérieur</button>
      <button class="chip" data-f="VE">VE · Extérieur</button>
      <button class="chip" data-f="QSER">QSER</button>
      <button class="chip" data-f="SEC">1ers secours</button>
    </div>
    <div class="actions">
      <button class="btn" id="revealAll">Tout ouvrir</button>
      <button class="btn" id="hideAll">Tout fermer</button>
      <button class="btn" id="shuffle">Mélanger</button>
    </div>
  </div>
</header>

<main class="grid" id="list"></main>

<footer>
  Cliquez sur une carte pour afficher la réponse. Les cartes « rappel » renvoient à une question déjà posée.
</footer>

/* ================= CONSTRUCTION DES CARTES ================= */
const LABEL = {VI:"VI", VE:"VE", QSER:"QSER", SEC:"1ers secours"};
const list = document.getElementById('list');
const stats = document.getElementById('stats');
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc  = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function answerHTML(a){
  if(a.length === 1) return '<p>'+esc(a[0])+'</p>';
  return '<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
}

DATA.forEach((item,i)=>{
  const d = document.createElement('details');
  d.className = 'card';
  d.dataset.type = item.t;
  d.dataset.i = i;
  d._s = norm(item.q+' '+item.a.join(' '));
  d.innerHTML =
    '<summary>'+
      '<div class="head">'+
        '<span class="badge '+item.t+'">'+LABEL[item.t]+'</span>'+
        '<span class="num">N° '+(i+1)+'</span>'+
      '</div>'+
      '<p class="q">'+esc(item.q)+'</p>'+
    '</summary>'+
    '<div class="answer"><span class="alabel">Réponse</span>'+answerHTML(item.a)+'</div>';
  d.addEventListener('toggle', updateStats);
  list.appendChild(d);
});

const cards = Array.from(list.children);

/* ================= COMPTEUR ================= */
function updateStats(){
  const visible = cards.filter(c=>c.style.display!=='none');
  const open = visible.filter(c=>c.open).length;
  stats.textContent = open + ' / ' + visible.length + ' révélées';
}

/* ================= FILTRES + RECHERCHE (optionnel) ================= */
let filter='ALL', query='';
function apply(){
  const q = norm(query.trim());
  cards.forEach(c=>{
    const okT = (filter==='ALL' || c.dataset.type===filter);
    const okQ = (!q || c._s.includes(q));
    c.style.display = (okT && okQ) ? '' : 'none';
  });
  let empty = list.querySelector('.empty');
  const visible = cards.filter(c=>c.style.display!=='none').length;
  if(visible===0){
    if(!empty){
      empty = document.createElement('div');
      empty.className='empty';
      empty.textContent='Aucune question ne correspond.';
      list.appendChild(empty);
    }
  } else if(empty){ empty.remove(); }
  updateStats();
}

const searchEl = document.getElementById('search');
if(searchEl){
  searchEl.addEventListener('input', e=>{ query=e.target.value; apply(); });
}
const chipsEl = document.getElementById('chips');
if(chipsEl){
  chipsEl.addEventListener('click', e=>{
    const chip = e.target.closest('.chip'); if(!chip) return;
    chipsEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    filter = chip.dataset.f;
    apply();
  });
}
const rAll = document.getElementById('revealAll');
if(rAll) rAll.addEventListener('click', ()=>{
  cards.forEach(c=>{ if(c.style.display!=='none') c.open = true; });
  updateStats();
});
const hAll = document.getElementById('hideAll');
if(hAll) hAll.addEventListener('click', ()=>{
  cards.forEach(c=>c.open = false);
  updateStats();
});
const shuf = document.getElementById('shuffle');
if(shuf) shuf.addEventListener('click', ()=>{
  const arr = cards.slice();
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  arr.forEach(c=>list.appendChild(c));
  window.scrollTo({top:0,behavior:'smooth'});
});

apply();
</script>
